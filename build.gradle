plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version + "+mc" + project.minecraft_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// in-game test (./gradlew runSelftest), not part of the mod jar
sourceSets {
	selftest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		"skycrypt-pv" {
			sourceSet sourceSets.main
		}
		"skycrypt-pv-selftest" {
			sourceSet sourceSets.selftest
		}
	}
	runs {
		selftest {
			client()
			name = "Self Test"
			source sourceSets.selftest
			vmArg "-Dskycryptpv.selftest=true"
			if (project.hasProperty('testmode')) {
				vmArg "-Dskycryptpv.selftest.mode=${project.property('testmode')}"
			}
			if (project.hasProperty('busy')) {
				vmArg "-Dskycryptpv.selftest.busy=true"
			}
			if (project.hasProperty('zoomstress')) {
				vmArg "-Dskycryptpv.selftest.zoomstress=${project.property('zoomstress')}"
			}
		}
	}
}

tasks.register('selftestJar', Jar) {
	from sourceSets.selftest.output
	archiveClassifier = 'selftest'
}

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases'
	}
	maven {
		name = 'DimasKama'
		url = 'https://maven.dimaskama.net/releases'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

	// chromium, bundled so the mod is just one jar
	include(implementation("net.dimaskama:mcef-modern:${mcef_modern_version}"))
	// jcef api is already inside mcef, only needed to compile
	compileOnly "me.friwi:jcef-api:${jcef_api_version}"
	// optional
	compileOnly "com.terraformersmc:modmenu:20.0.1"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", minecraft_version
	inputs.property "loader_version", loader_version
	inputs.property "fabric_version", fabric_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
				"minecraft_version": inputs.properties.minecraft_version,
				"loader_version": inputs.properties.loader_version,
				"fabric_version": inputs.properties.fabric_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
